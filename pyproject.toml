[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "async-researcher"
version = "1.0.0"
description = "A resilient asynchronous research assistant with cited answers"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.31.0",
  "httpx==0.28.1",
  "numpy==2.5.2",
  "google-genai==2.23.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "tenacity==9.1.4",
  "streamlit==1.64.0",
]

[project.scripts]
researcher = "researcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["researcher"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["tests/conftest.py", "tests/test_ai_smoke.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["researcher"]
mypy_path = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "ai.*"]
ignore_missing_imports = true
follow_imports = "skip"
