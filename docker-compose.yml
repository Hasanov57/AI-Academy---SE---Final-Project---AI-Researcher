services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: researcher
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d researcher"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - researcher-postgres:/var/lib/postgresql/data

  researcher:
    build: .
    volumes:
      - ./artefacts:/app/artefacts
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://researcher:${POSTGRES_PASSWORD}@db:5432/researcher
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    command:
      - streamlit
      - run
      - src/researcher/ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://researcher:${POSTGRES_PASSWORD}@db:5432/researcher
    depends_on:
      db:
        condition: service_healthy

volumes:
  researcher-postgres:
